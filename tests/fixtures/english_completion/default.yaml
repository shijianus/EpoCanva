# EpoCanva P2.1 test fixture -- default settings for English prefix completion.
#
# Same shape as tests/fixtures/rime_probe/default.yaml, with one schema listed:
# epocanva_test_english.
#
# It defines NO punctuator, NO key_binder, NO recognizer, NO dictionary and NO
# translator beyond the one the schema names. Nothing here is imported from an
# upstream production preset and nothing here is a distribution candidate.
#
# Consumed by: tools/rime_english_completion, deployed through the public C API
# slot deploy_config_file("default.yaml", "config_version").

config_version: "0.0.0-p2.1-fixture"

# Exactly one entry, for the reason recorded in tests/fixtures/rime_raw/README.md:
# Switcher::CreateSchema() resolves the synthetic ".default" schema from this list
# (src/rime/engine.cc:338-341, src/rime/switcher.cc:174-196), and a second entry
# would make a new session's initial schema depend on user.yaml history
# (src/rime/switcher.cc:179-181) instead of being deterministic.
schema_list:
  - schema: epocanva_test_english

# Inherited by every schema through DefaultConfigPlugin's optional include of
# default:/menu (src/rime/config/default_config_plugin.cc:22-28). The schema
# restates page_size explicitly rather than relying on that merge. 8 matches the
# component's candidate budget so a page shows the whole list.
menu:
  page_size: 8
