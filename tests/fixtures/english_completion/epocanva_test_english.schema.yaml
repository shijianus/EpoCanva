# EpoCanva P2.1 test fixture -- English prefix-completion schema.
#
# schema_id: epocanva_test_english
#
# WHAT THIS IS: a schema whose only translator is EpoCanva's own
# `epocanva_english_translator`, backed by the hand-written word list in
# lexicon.tsv. Entering a lowercase prefix produces the typed text plus real
# completions taken from that list, and selecting a completion commits the whole
# word.
#
# WHAT THIS IS NOT: not spelling correction, not next-word prediction, not
# personalised learning, not a segmentation implementation, and not an English word
# list of any useful size -- the word list here is 54 hand-written rows. Case IS
# handled, but only as the ASCII mapping of P2.2 (lowercase / initial-capital /
# uppercase shapes complete, mixed case does not); no Unicode case folding, no
# automatic sentence capitalisation. Space is handled by the P2.5 policy: commit
# what is composing, then exactly one U+0020 -- no word-boundary detection, no
# dictionary-driven splitting of run-together input.
#
# Component and option names were read out of the pinned checkout
# (librime 1.17.0 / 33e78140250125871856cdc5b42ddc6a5fcd3cd4):
#   speller, fluid_editor      -> src/rime/gear/gears_module.cc:46-57
#   abc_segmentor, fallback_…  -> src/rime/gear/gears_module.cc:60-65
#   epocanva_english_space     -> engine/rime_components/english/english_module.cc
#   epocanva_english_translator@english
#                              -> engine/rime_components/english/english_module.cc;
#                                 the "@english" part selects the name space the
#                                 translator reads its own options from
#                                 (src/rime/ticket.cc:13-22), which keeps the
#                                 word-list key out of any shared "translator" tree.
#   The space processor takes no name space and reads no config: its behaviour is
#   fixed by engine/languages/en/english_space_policy.h, so a schema cannot widen or
#   narrow the commitment rules by editing a key.
#
# NO echo_translator is listed. The component emits the original input as candidate
# 0 itself, so the merge order of "original then completions" is set by
# english_translator.cc rather than inherited from echo's -100 quality and its
# position later in the translator list.

schema:
  schema_id: epocanva_test_english
  # ASCII-only id: it crosses the C ABI as UTF-8 bytes and the test asserts it
  # byte-for-byte.
  name: EpoCanva English prefix completion test
  version: "0.0.0-p2.5-fixture"

menu:
  # 8 so that the whole candidate budget (1 original + 7 completions) is visible on
  # the first page; a smaller page size would make the cap unobservable here.
  page_size: 8

engine:
  processors:
    # P2.5: the English space policy FIRST, then the same inert chain as
    # tests/fixtures/rime_probe. Order is the whole mechanism -- the engine walks
    # this list and stops at the first processor that does not return kNoop
    # (src/rime/engine.cc:99-108), so being first is what lets our processor answer
    # the space bar before fluid_editor's own space binding (which commits the
    # composition but never produces a space character) sees it.
    #
    # It returns kNoop for every other key, so the speller still owns letters and
    # fluid_editor still owns BackSpace / Escape / Return. Nothing here consumes the
    # keys the test injects before the translator sees them.
    - epocanva_english_space
    - speller
    - fluid_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - epocanva_english_translator@english

speller:
  # P2.2: A-Z are in the alphabet on purpose. Speller::ProcessKeyEvent() drops any
  # printable key that is not in speller/alphabet or speller/delimiter
  # (src/rime/gear/speller.cc:109-110) and the chain has no char_handler to catch it
  # (editor/char_handler is noop below), so without these 26 bytes an uppercase key
  # never reaches the composition at all and "Hel" could not be tested through real
  # keys. Nothing in the chain lowercases: speller.cc, abc_segmentor.cc, editor.cc,
  # context.cc and key_event.cc contain no tolower/toupper, and the only use of
  # shift() in speller.cc is for the space key (:107).
  #
  # P2.3: the ASCII letters are joined by the two word delimiters (' -), the ten
  # digits and the eleven technical marks @ . _ : / \ ? & = # % +. THIS IS THE
  # PROTECTION MECHANISM, not a relaxation of it. Reason, from the pinned source:
  #   - a byte outside speller/alphabet is dropped by the speller (:109-110), so the
  #     composition would stop at "user" and the "@" would never be seen at all;
  #   - a byte that IS in the alphabet keeps AbcSegmentor::Proceed() extending the
  #     same segment over it (:46 tests membership, and :34-36 makes every alphabet
  #     byte an initial because speller/initials is unset), so "user@example.com"
  #     arrives as ONE segment covering the whole token;
  #   - if instead the composition were cut, FallbackSegmentor::Proceed()
  #     (src/rime/gear/fallback_segmentor.cc:16-56) would add one-byte "raw"
  #     segments for the leftovers, and this translator would then be queried about
  #     the letters only -- completing "user" while the user was typing an address,
  #     which is exactly the corruption P2.3 forbids.
  # So the marks are accepted into the composition and then refused by the token
  # layer, which counts the refusal (english_token.h ->
  # CompletionOutcome::kProtectedText). Nothing is stripped, translated or
  # "normalised" on the way: the candidate list for these inputs is the typed text
  # and nothing else. The integration test asserts
  # queries_covering_part_of_input stays 0 while typing them, which is what proves
  # the token reached the translator whole.
  #
  # YAML note: the backslash below is DOUBLED because this is a double-quoted YAML
  # scalar, which processes escapes: the two bytes \\ below deploy as the single
  # 0x5C byte the token layer expects.
  alphabet: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'@._:/\\?&=#%+-"
  # Left empty on purpose. A byte in speller/delimiter is accepted by the speller
  # (src/rime/gear/speller.cc:109) but then makes the NEXT byte have to be an
  # initial (src/rime/gear/abc_segmentor.cc:50-56), which is a segmentation rule,
  # and P2.3 needs "user@example.com" to stay one segment that the language core
  # refuses as a whole. The two word delimiters are therefore ordinary alphabet
  # bytes here; whether they are legal inside a token is english_token.h's call.
  delimiter: ""

editor:
  # Neutralise the two default behaviours that would otherwise add text or commit
  # without the test asking (reasons recorded in tests/fixtures/rime_raw/README.md).
  char_handler: noop
  bindings:
    space: noop

english:
  # Path the Translator resolves. Relative paths are resolved against the engine's
  # shared data directory (RimeTraits.shared_data_dir -> Deployer::shared_data_dir,
  # src/rime/setup.cc:46-47, src/rime/deployer.h:35), NEVER against the process
  # working directory. The test program stages the word list at
  # <shared>/lexicon/epocanva_test_lexicon.tsv, so this line is the join point.
  lexicon_path: "lexicon/epocanva_test_lexicon.tsv"
  # The component's own default is 7 and it may only be lowered, so that the
  # "at most 8 candidates" contract cannot be widened by configuration. Stated
  # explicitly here to make the budget visible in the fixture.
  max_completions: 7
