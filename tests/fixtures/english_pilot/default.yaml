# EpoCanva P2.4 pilot fixture -- default settings for the REAL-word-list run.
#
# Same shape as tests/fixtures/english_completion/default.yaml, and deliberately
# separate from it (P2.4 brief boundary 6 and 7): the hand-written 54-row fixture
# keeps its own config, its own run directory and all of its own CTest cases, and
# the pilot gets its own copy of each. Nothing in this directory is imported from
# an upstream production preset and nothing here is a distribution candidate.
#
# Consumed by: tools/rime_english_completion --mode pilot-lexicon, deployed
# through the public C API slot deploy_config_file("default.yaml", "config_version").

config_version: "0.0.0-p2.4-fixture"

# Exactly one entry, for the reason recorded in tests/fixtures/rime_raw/README.md:
# Switcher::CreateSchema() resolves the synthetic ".default" schema from this list
# (src/rime/engine.cc:338-341, src/rime/switcher.cc:174-196), and a second entry
# would make a new session's initial schema depend on user.yaml history
# (src/rime/switcher.cc:179-181) instead of being deterministic.
#
# The id differs from the hand-written fixture's on purpose: two schemas with the
# same id in one repository would make a compiled-artefact log ambiguous about which
# word list it describes.
schema_list:
  - schema: epocanva_pilot_english

# Inherited by every schema through DefaultConfigPlugin's optional include of
# default:/menu (src/rime/config/default_config_plugin.cc:22-28). The schema
# restates page_size explicitly rather than relying on that merge.
#
# 8, the same value as the hand-written fixture, and that is the point: the budget
# contract (1 original + at most 7 completions) must hold against 42k rows exactly
# as it holds against 54. A bigger page size here would let a candidate cap bug hide.
menu:
  page_size: 8
